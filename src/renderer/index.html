<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
  />
  <title>Fluxo · Gestion comercial</title>
  <link rel="stylesheet" href="styles/app.css" />
  <script src="js/preboot.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <!-- ------------------------------------------------------------ -->
    <!-- Barra lateral                                                -->
    <!-- ------------------------------------------------------------ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30">
            <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#bg)"></rect>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3b82f6"></stop>
                <stop offset="1" stop-color="#1e40af"></stop>
              </linearGradient>
            </defs>
            <rect x="7" y="18" width="4" height="7" rx="1.4" fill="#ffffff"></rect>
            <rect x="14" y="13" width="4" height="12" rx="1.4" fill="#ffffff" opacity=".85"></rect>
            <rect x="21" y="8" width="4" height="17" rx="1.4" fill="#ffffff" opacity=".7"></rect>
          </svg>
        </div>
        <div class="brand__text">
          <strong>Fluxo</strong>
          <span>Gestion comercial</span>
        </div>
      </div>

      <nav class="sidebar__nav" id="nav"></nav>

      <div class="sidebar__footer">
        <button class="sidebar__action" data-accion="respaldar" type="button">
          <span class="dot"></span>
          <span>Respaldar datos</span>
        </button>
        <div class="sidebar__version" id="sidebar-version">&nbsp;</div>
      </div>
    </aside>

    <!-- ------------------------------------------------------------ -->
    <!-- Area principal                                               -->
    <!-- ------------------------------------------------------------ -->
    <main class="main">
      <header class="topbar" id="topbar">
        <button class="btn btn--ghost btn--icon topbar__toggle" type="button" data-accion="alternar-sidebar" title="Mostrar u ocultar la barra lateral" aria-label="Alternar barra lateral">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
        </button>
        <div class="topbar__title">
          <h1 id="page-title">Panel</h1>
          <p id="page-subtitle">Cargando informacion...</p>
        </div>
        <div class="topbar__tools" id="page-actions"></div>
      </header>
      <div class="workspace" id="workspace">
        <div class="loading">
          <div class="spinner"></div>
          <p>Preparando la informacion...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="views/documento.js"></script>
  <script src="views/panel.js"></script>
  <script src="views/cotizaciones.js"></script>
  <script src="views/facturas.js"></script>
  <script src="views/recaudos.js"></script>
  <script src="views/gastos.js"></script>
  <script src="views/clientes.js"></script>
  <script src="views/asesores.js"></script>
  <script src="views/proveedores.js"></script>
  <script src="views/productos.js"></script>
  <script src="views/ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
